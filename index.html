<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Lab — creative test tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F8; --panel:#FFFFFF; --ink:#16222F; --ink-2:#596776; --ink-3:#8A96A3;
  --line:#D8DFE5; --line-2:#E8EDF1; --grid:rgba(36,87,197,.055);
  --blue:#2457C5; --blue-soft:#E3EBFA;
  --win:#1E8656; --win-soft:#E1F2E9; --watch:#A86E06; --watch-soft:#FBF0D9;
  --kill:#BF3329; --kill-soft:#F9E3E1; --early:#6B7785; --early-soft:#ECEFF2;
  --radius:10px; --radius-sm:6px;
  --font:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E151D; --panel:#151F2A; --ink:#E4EAF0; --ink-2:#9AA7B4; --ink-3:#6D7B89;
    --line:#26333F; --line-2:#1D2833; --grid:rgba(110,150,240,.06);
    --blue:#7DA2F2; --blue-soft:#1B2A45;
    --win:#4CC28A; --win-soft:#143327; --watch:#E2A93C; --watch-soft:#3A2C10;
    --kill:#F07A70; --kill-soft:#3D1A18; --early:#9AA7B4; --early-soft:#1E2934;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font); font-stretch:100%; color:var(--ink); background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:24px}
.brand{font-stretch:62%;font-weight:800;font-size:30px;letter-spacing:-.01em;line-height:1;padding:0 8px}
.brand small{display:block;font-stretch:100%;font-weight:400;font-size:12px;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:var(--radius-sm);color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.nav button:hover{color:var(--ink);background:var(--line-2)}
.nav button[aria-current=page]{color:var(--ink);background:var(--panel);box-shadow:inset 3px 0 0 var(--blue);font-weight:600}
.nav .count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px}
main{padding:32px clamp(16px,4vw,48px) 64px;min-width:0;max-width:1280px}
h1{font-stretch:75%;font-weight:700;font-size:34px;line-height:1.05;margin:0 0 6px;letter-spacing:-.01em}
.lede{color:var(--ink-2);margin:0 0 28px;max-width:68ch}
h2{font-size:17px;font-weight:650;margin:0 0 4px}
.note{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* The ledger: the money trail, left to right */
.ledger{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.ledger > div{padding:18px 20px 20px;position:relative;min-width:0}
.ledger > div + div{border-left:1px solid var(--line)}
.ledger > div + div::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.ledger .lab{font-size:13px;color:var(--ink-2)}
.ledger .num{font-stretch:62%;font-weight:700;font-size:clamp(30px,3.6vw,46px);line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.ledger .sub{font-size:12px;color:var(--ink-3);margin-top:8px}
.neg{color:var(--kill)} .pos{color:var(--win)}
@media (max-width:900px){
  .ledger{grid-template-columns:1fr 1fr}
  .ledger > div + div{border-left:0}
  .ledger > div{border-top:1px solid var(--line)}
  .ledger > div:nth-child(-n+2){border-top:0}
  .ledger > div:nth-child(even){border-left:1px solid var(--line)}
  .ledger > div + div::before{display:none}
  .ledger > div:last-child{grid-column:1/-1}
}

/* status strip */
.strip{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line-2);margin:12px 0}
.strip span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.insights li{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.insights li:first-child{border-top:0;padding-top:4px}
.insights li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--ink-3)}
.insights li.bad::before{background:var(--kill)} .insights li.good::before{background:var(--win)} .insights li.warn::before{background:var(--watch)}
.insights b{font-weight:650}

/* tables */
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;font-weight:600;color:var(--ink-2);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer}
th[aria-sort=ascending] button::after{content:" ▲";font-size:10px}
th[aria-sort=descending] button::after{content:" ▼";font-size:10px}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right} th.r{text-align:right}
.muted{color:var(--ink-3)}
.hook{min-width:16rem;max-width:30rem}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--line-2)}
tr.detail td{background:var(--paper);padding:14px 16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:10px 24px;font-size:13px}
.kv div span{display:block;color:var(--ink-3);font-size:12px}
.kv a{color:var(--blue);word-break:break-all}
.small{color:var(--ink-3);font-size:12px}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell i{display:block;height:8px;border-radius:4px;background:var(--blue);opacity:.75}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.t-win{background:var(--win-soft);color:var(--win)} .t-watch{background:var(--watch-soft);color:var(--watch)}
.t-kill{background:var(--kill-soft);color:var(--kill)} .t-early{background:var(--early-soft);color:var(--early)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1 1 220px}
input[type=search],input[type=text],input[type=url],input[type=number],select{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;min-width:0}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);padding:8px 14px;font-weight:550}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--kill)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:14px;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop strong{display:block;font-stretch:75%;font-size:24px;font-weight:700;margin-bottom:4px}
.drop-slim{padding:16px 20px;text-align:left;font-size:14px;color:var(--ink-2)}
.paste summary{cursor:pointer;font-weight:600}
.paste[open] summary{margin-bottom:4px}
.drop-slim strong{font-size:19px;color:var(--ink)}
.steps{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px}
.steps li{margin:4px 0}
.log{list-style:none;margin:12px 0 0;padding:0;font-size:13px}
.log li{padding:8px 0;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;gap:12px}
.log li .ok{color:var(--win)} .log li .err{color:var(--kill)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:12px}
.rules label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-2)}
textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;resize:vertical;width:100%}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.field input{width:100%}
.h3{font-size:14px;font-weight:600;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--kill-soft);color:var(--ink)}
.chip b{color:var(--kill);font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--ink-3)}
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{all:unset;cursor:pointer;font-size:14px;padding:6px 12px;border-radius:999px;font-weight:550}
.kchip b{font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.kchip.up{background:var(--win-soft);color:var(--win)} .kchip.down{background:var(--kill-soft);color:var(--kill)}
.kchip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.kw{font-weight:600}
.lift{display:flex;align-items:center;gap:8px;min-width:150px}
.lift-track{position:relative;flex:1;height:10px;background:var(--line-2);border-radius:5px}
.lift-track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.lift-track i{position:absolute;top:0;bottom:0;border-radius:5px}
.lift-track i.up{left:50%;background:var(--win)} .lift-track i.down{right:50%;background:var(--kill)}
.lift-num{width:3.6rem;text-align:right;font-variant-numeric:tabular-nums}
mark{background:color-mix(in srgb,var(--blue) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px}
table.mini{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm)}
table.mini td{padding:6px 10px}
.link{all:unset;cursor:pointer;color:var(--blue);margin-right:8px}
.link:focus-visible{outline:2px solid var(--blue)}
.plan-card{border-left:4px solid var(--blue);margin-bottom:16px}
.plan-text{margin:6px 0 0;font-size:16px;line-height:1.55;max-width:70ch}
.entry-date{font-stretch:75%;font-size:22px;font-weight:700;margin:0}
.entry-fields{margin:8px 0 0;display:grid;gap:12px}
.entry-fields dt{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.entry-fields dd{margin:0;max-width:75ch;line-height:1.55}
.checks{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px 12px;margin:0;display:flex;flex-wrap:wrap;gap:8px 16px}
.checks legend{font-size:13px;color:var(--ink-2);padding:0 4px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.checks input{width:16px;height:16px;accent-color:var(--blue)}
.adform .h3:first-of-type{margin-top:6px}
.adform .rules input,.adform .rules select{width:100%}
.danger-link{color:var(--kill)}
.sum-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .lab{font-size:13px;color:var(--ink-2)}
.kpi .num{font-stretch:62%;font-weight:700;font-size:38px;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--ink-3);margin-top:4px}
.dl{font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dl.pos{color:var(--win)} .dl.neg{color:var(--kill)}
.best{margin:0;padding-left:22px}
.best li{padding:8px 0;border-top:1px solid var(--line-2)} .best li:first-child{border-top:0;padding-top:0}
.best-hook{font-weight:550}
.choices{list-style:none;margin:0;padding:0}
.choices li{padding:9px 0;border-top:1px solid var(--line-2)} .choices li:first-child{border-top:0;padding-top:0}
svg.trend{display:block;overflow:visible}
svg.trend .axis{stroke:var(--line)}
svg.trend .b{fill:var(--blue)} svg.trend .b0{fill:var(--line)}
svg.trend text{font-family:var(--font);fill:var(--ink-2);text-anchor:middle;font-size:12px;font-variant-numeric:tabular-nums}
svg.trend .v{fill:var(--ink);font-weight:600}
@media print{
  body{background:#fff}
  .side,.no-print,.toast,.drag-veil{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  .panel,.kpi{break-inside:avoid}
}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:minmax(6rem,11rem) 1fr 5.5rem;gap:10px;align-items:center;font-size:14px}
.bars .b .t{height:12px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bars .b .t i{display:block;height:100%;background:var(--blue);border-radius:6px}
.bars .b .v{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20;max-width:90vw}
.drag-veil{position:fixed;inset:0;background:color-mix(in srgb,var(--blue) 14%,transparent);border:3px dashed var(--blue);z-index:30;display:none;align-items:center;justify-content:center;font-stretch:75%;font-size:32px;font-weight:700;color:var(--blue)}
.drag-veil.on{display:flex}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:12px;overflow-x:auto}
  .brand{font-size:22px;padding:0}
  .brand small,.side-foot,.nav .count{display:none}
  .nav{flex-direction:row}
  .nav button[aria-current=page]{box-shadow:inset 0 -2px 0 var(--blue)}
  main{padding-top:20px}
  h1{font-size:28px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Ad Lab<small>Creative test tracker</small></div>
    <nav class="nav" aria-label="Sections">
      <button data-view="summary">Summary</button>
      <button data-view="overview">Overview</button>
      <button data-view="ads">Ads <span class="count" id="c-ads"></span></button>
      <button data-view="keywords">Keywords</button>
      <button data-view="patterns">Patterns</button>
      <button data-view="journal">Journal <span class="count" id="c-journal"></span></button>
      <button data-view="bans">Ban log <span class="count" id="c-bans"></span></button>
      <button data-view="spend">Spend <span class="count" id="c-spend"></span></button>
      <button data-view="data">Import &amp; data</button>
    </nav>
    <div class="side-foot" id="saved-note">Everything is saved in this browser.</div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<div class="drag-veil" id="veil">Drop CSV files to import</div>
<input type="file" id="file" accept=".csv,text/csv" multiple hidden>

<script>
/* ============ Storage ============ */
const STORE = 'adlab.v1';
const DEFAULT_RULES = { minSpend: 10, winRoas: 1.3, watchRoas: 0.8, minGroup: 10 };
function blank() { return { ads: [], spend: [], bans: [], journal: [], creatives: [], names: { accounts: [], bcs: [] }, ignored: [], imports: [], syncs: [], rules: { ...DEFAULT_RULES } }; }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s) return { ...blank(), ...s, rules: { ...DEFAULT_RULES, ...(s.rules || {}) } };
  } catch (e) {}
  return blank();
}
let state = load();
const canSave = (() => { try { localStorage.setItem(STORE + '.t', '1'); localStorage.removeItem(STORE + '.t'); return true; } catch (e) { return false; } })();
let warnedSave = false;
function save() {
  if (!canSave) {
    if (!warnedSave) { warnedSave = true; toast('This preview can’t save. Download index.html and open it in your browser to keep your data.'); }
    return;
  }
  try { localStorage.setItem(STORE, JSON.stringify(state)); }
  catch (e) { toast('Couldn’t save — your browser storage is full. Download a backup from Import & data.'); }
}

/* ============ Helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const usd = (n) => n == null || Number.isNaN(n) ? '—' : (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = (n) => n == null ? '—' : (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2, minimumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2 });
const int = (n) => n == null ? '—' : Math.round(n).toLocaleString('en-US');
const pct = (n) => n == null || !isFinite(n) ? '—' : Math.round(n * 100) + '%';
const roasFmt = (n) => n == null || !isFinite(n) ? '—' : n.toFixed(2) + 'x';
const plural = (n, a, b) => `${int(n)} ${n === 1 ? a : (b || a + 's')}`;
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 4200);
}
function money(s) {
  const t = String(s ?? '').trim();
  if (!t || !/[0-9]/.test(t)) return null;
  const neg = /^\(.*\)$/.test(t) || /^-/.test(t) || /^−/.test(t);
  const n = Number(t.replace(/[^0-9.]/g, ''));
  return Number.isNaN(n) ? null : (neg ? -n : n);
}
function count(s) {
  const t = String(s ?? '').trim();
  if (!t) return null;
  const n = Number(t.replace(/[^0-9.]/g, ''));
  return Number.isNaN(n) ? null : n;
}
const thisYear = new Date().getFullYear(), thisMonth = new Date().getMonth() + 1;
function dateKey(s) {
  const t = String(s || '').trim();
  let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return +m[1] * 10000 + +m[2] * 100 + +m[3];
  if ((m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/))) {
    let y = m[3] ? +m[3] : (+m[1] > thisMonth + 1 ? thisYear - 1 : thisYear);
    if (y < 100) y += 2000;
    return y * 10000 + +m[1] * 100 + +m[2];
  }
  return 0;
}
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const shortId = (u) => { const m = String(u || '').match(/(\d{10,})/); return m ? '…' + m[1].slice(-6) : String(u || ''); };

/* ============ CSV ============ */
function parseCSV(text) {
  text = String(text).replace(/^﻿/, '');
  const delim = (text.split('\n')[0].match(/\t/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;

const keyToDate = (k) => new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100);
const dateToKey = (d) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
const fmtKey = (k) => { const d = keyToDate(k); return (d.getMonth() + 1) + '/' + d.getDate(); };
const sum = { range: '7' };
function period(range) {
  const keys = state.ads.map((a) => dateKey(a.date)).filter(Boolean);
  if (range === 'all' || !keys.length) return { ads: state.ads, prev: null, label: 'All time', from: 0, to: 99999999 };
  const latest = Math.max(...keys);
  const within = (from, to) => state.ads.filter((a) => { const k = dateKey(a.date); return k >= from && k <= to; });
  if (range === '7' || range === '14') {
    const n = +range, end = keyToDate(latest);
    const start = new Date(end); start.setDate(end.getDate() - (n - 1));
    const pEnd = new Date(start); pEnd.setDate(start.getDate() - 1);
    const pStart = new Date(pEnd); pStart.setDate(pEnd.getDate() - (n - 1));
    const from = dateToKey(start), pFrom = dateToKey(pStart), pTo = dateToKey(pEnd);
    return { ads: within(from, latest), prev: within(pFrom, pTo), label: `${fmtKey(from)} – ${fmtKey(latest)}`, prevLabel: `the ${n} days before`, from, to: latest };
  }
  // a single launch day, compared with the launch day before it
  const k = dateKey(range);
  const earlier = [...new Set(keys.filter((x) => x < k))].sort((a, b) => b - a)[0];
  return { ads: within(k, k), prev: earlier ? within(earlier, earlier) : null, label: range, prevLabel: earlier ? fmtKey(earlier) : '', from: k, to: k };
}
function delta(cur, prev, goodUp, fmt) {
  if (cur == null || prev == null || !isFinite(cur) || !isFinite(prev)) return '';
  if (prev === 0) return cur === 0 ? '<span class="dl">no change</span>' : `<span class="dl ${goodUp ? 'pos' : 'neg'}">up from ${fmt(0)}</span>`;
  const ch = (cur - prev) / Math.abs(prev);
  if (Math.abs(ch) < 0.005) return '<span class="dl">no change</span>';
  const good = goodUp ? ch > 0 : ch < 0;
  return `<span class="dl ${good ? 'pos' : 'neg'}">${ch > 0 ? '+' : '−'}${Math.round(Math.abs(ch) * 100)}%</span>`;
}

function trendChart(days) {

/* ---- Keywords ---- */
// Words that carry no meaning on their own. Phrases can still contain them ("student id", "got paid").
const KW_STOP = new Set(('a an the and or but so to of in on at by for with from as is are was were be been am do does did ' +
  'i im me my mine u you ur your yall we us our they them their he she it its this that these those ts ' +
  'not no yes just when how what why who where which if then than too very can will would could should ' +
  'have has had got get gets all any some one up out about into over after before bc cuz').split(' '));
const isEmoji = (w) => /\p{Extended_Pictographic}/u.test(w);
// "qiuizz" and "qiuiz", "bandss" and "bands" count as the same word
const kwKey = (w) => isEmoji(w) ? w : w.replace(/(\p{L})\1+/gu, '$1');
function kwTokens(text, mode) {
  const raw = (String(text || '').toLowerCase().replace(/['’]/g, '').match(/\p{Extended_Pictographic}|[\p{L}\p{N}]+/gu) || []);
  const out = new Map(); // key -> original spelling
  if (mode !== 'phrases') raw.forEach((w) => { if (isEmoji(w) || (w.length > 1 && !KW_STOP.has(w) && !/^\d+$/.test(w))) out.set(kwKey(w), w); });
  if (mode !== 'words') for (let i = 0; i < raw.length - 1; i++) {
    const a = raw[i], b = raw[i + 1];
    if (isEmoji(a) || isEmoji(b)) continue;
    if (KW_STOP.has(a) && KW_STOP.has(b)) continue;
    if (a.length < 2 && b.length < 2) continue;
    out.set(kwKey(a) + ' ' + kwKey(b), a + ' ' + b);
  }
  return out;
}
const kw = { mode: 'both', src: 'hook', range: 'all', sort: 'lift', dir: -1, open: null };
function kwRangeAds() {
  const ads = state.ads;
  if (kw.range === 'all') return ads;
  const latest = Math.max(...ads.map((a) => dateKey(a.date)));
  if (kw.range === '7' || kw.range === '14') {
    const d = new Date(String(latest).replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3') + 'T00:00:00');
    d.setDate(d.getDate() - (+kw.range - 1));
    const from = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    return ads.filter((a) => dateKey(a.date) >= from);
  }
  return ads.filter((a) => a.date === kw.range);
}
function keywordStats(ads, mode, src) {
  const ignored = new Set(state.ignored || []);
  const total = agg(ads);
  const useSpend = total.spend > 0;
  // baseline: conversions per dollar across these ads (or per ad when nothing has spend logged)
  const base = useSpend ? total.conv / total.spend : (ads.length ? total.conv / ads.length : 0);
  const m = useSpend ? Math.max(1, state.rules.minSpend || 10) : 3; // how much evidence a keyword needs before it moves away from average
  const map = new Map();
  ads.forEach((a) => {
    const text = src === 'both' ? (a.hook || '') + ' ' + (a.caption || '') : (a.hook || '');
    kwTokens(text, mode).forEach((orig, key) => {
      if (ignored.has(key)) return;
      let e = map.get(key);
      if (!e) { e = { key, spell: new Map(), ads: [] }; map.set(key, e); }
      e.ads.push(a); e.spell.set(orig, (e.spell.get(orig) || 0) + 1);
    });
  });
  const rows = [];
  map.forEach((e) => {
    if (e.ads.length < 2) return; // a word in one ad is that ad, not a pattern
    const s = agg(e.ads);
    const restSpend = total.spend - s.spend, restConv = total.conv - s.conv;
    const exposure = useSpend ? s.spend : s.n;
    const rate = exposure ? s.conv / exposure : 0;
    const smoothed = (s.conv + m * base) / (exposure + m);
    rows.push({
      key: e.key, word: [...e.spell].sort((x, y) => y[1] - x[1])[0][0], phrase: e.key.includes(' '),
      n: s.n, spend: s.spend, conv: s.conv, rev: s.rev, cpa: s.cpa, roas: s.roas, epc: s.epc,
      cpaRest: restConv ? restSpend / restConv : null,

const BAN_KINDS = ['Ad disapproved', 'Ad account suspended', 'Business Center banned', 'Other'];
const STOP = new Set('the a an and or to of in on for with my me i u you ur your is it its this that ts so be bc at by from we our us yall y’all just when how what why not no all'.split(' '));
function threads() {
  const ads = state.ads; if (ads.length < 4) return null;
  const banned = ads.filter((a) => isBanned(a) || isDisapproved(a));
  const others = ads.filter((a) => !isBanned(a) && !isDisapproved(a) && a.status);
  const base = banned.length / ads.length;
  // traits that show up more often in banned ads
  const traits = [];
  for (const [key, label, fn] of DIMS.filter((d) => d[0] !== 'date' && d[0] !== 'launch_hour')) {
    for (const [val, list] of groupBy(ads, fn)) {
      if (/^(Not logged|Originals)$/.test(val) || list.length < 3) continue;
      const b = list.filter((a) => isBanned(a) || isDisapproved(a)).length;
      traits.push({ label, val, n: list.length, b, rate: b / list.length });
    }
  }
  traits.sort((x, y) => y.rate - x.rate || y.n - x.n);
  // words in hooks and captions
  const words = (a) => new Set(String((a.hook || '') + ' ' + (a.caption || '')).toLowerCase().replace(/[^\p{L}\p{N}\p{Extended_Pictographic}\s']/gu, ' ').split(/\s+/).filter((w) => w.length > 2 && !STOP.has(w) || /\p{Extended_Pictographic}/u.test(w)));
  const wc = new Map();
  banned.forEach((a) => words(a).forEach((w) => { const e = wc.get(w) || { w, b: 0, o: 0 }; e.b++; wc.set(w, e); }));
  others.forEach((a) => words(a).forEach((w) => { const e = wc.get(w); if (e) e.o++; }));
  const topWords = [...wc.values()].filter((e) => e.b >= Math.max(3, Math.ceil(banned.length * 0.15))).sort((x, y) => y.b - x.b).slice(0, 12);
  const notes = banned.filter((a) => a.notes && !/^testing$/i.test(a.notes)).map((a) => ({ date: a.date, hook: a.hook, notes: a.notes }));
  return { banned: banned.length, others: others.length, total: ads.length, base, traits: traits.filter((t) => t.rate >= Math.min(0.99, base + 0.1) || t.rate === 1).slice(0, 8), topWords, notes };
}

          ${T.topWords.length ? `<h3 class="h3">Words in their hooks and captions</h3>
            <div class="chips">${T.topWords.map((e) => `<span class="chip" title="In ${e.b} banned ads and ${e.o} that stayed up">${esc(e.w)} <b>${e.b}</b>${T.others ? `<i>/${e.o}</i>` : ''}</span>`).join('')}</div>
            <p class="small" style="margin:6px 0 14px">Number = banned ads using it${T.others ? ' / ads that stayed up using it' : ''}.</p>` : ''}
          ${T.traits.length ? `<h3 class="h3">Choices with the highest ban rate</h3>
            <ul class="insights">${T.traits.map((t) => `<li class="bad"><div><b>${esc(t.label)}: ${esc(t.val)}</b> — ${int(t.b)} of ${int(t.n)} banned (${pct(t.rate)})</div></li>`).join('')}</ul>` : ''}

      </section>
    </div>
    ${reasons.size ? `<section class="panel" style="margin-top:16px"><h2>Reasons so far</h2><p class="note">How often each reason has come up.</p>

      <div class="toolbar" style="justify-content:space-between"><div><h2>History</h2><p class="note" style="margin:0">Newest first.</p></div>${bans.length ? '<button class="btn" id="b-dl">Download CSV</button>' : ''}</div>

  el.querySelectorAll('[data-del]').forEach((btn) => btn.addEventListener('click', () => {

/* ---- Spend ---- */
const SPEND_WHATS = ['Ad account balance', 'BC', 'Residential proxy', 'Sticky proxy', 'Domain', 'Followers'];
const spendForm = { open: false, id: null };
function spendFormHTML() {
  const x = spendForm.id ? state.spend.find((s) => s.id === spendForm.id) : null;
  const whats = [...new Set([...SPEND_WHATS, ...state.spend.map((s) => (s.what || '').trim()).filter(Boolean)])];
  const cards = [...new Set(state.spend.map((s) => (s.card || '').trim()).filter(Boolean))];
  return `<section class="panel" id="spend-form" style="margin-bottom:16px">
    <div class="toolbar" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">${x ? 'Edit charge' : 'Add a charge'}</h2><button class="btn" id="sf-cancel">Cancel</button></div>
    <div class="rules">
      <label>Date<input type="date" id="sf-date" value="${esc(x ? isoFrom(x.date) : todayISO())}"></label>
      <label>What it was for<input type="text" id="sf-what" list="dl-what" value="${esc(x ? x.what : '')}" autocomplete="off"></label>
      <label>Card (last 4)<input type="text" id="sf-card" list="dl-card" value="${esc(x ? x.card : '')}" autocomplete="off"></label>
      <label>Amount ($)<input type="number" id="sf-amount" min="0" step="0.01" inputmode="decimal" value="${x && x.amount != null ? x.amount : ''}"></label>
    </div>
    <label class="field" style="margin-top:10px">Notes<input type="text" id="sf-notes" value="${esc(x ? x.notes : '')}"></label>
    <div class="toolbar" style="margin:14px 0 0"><button class="btn primary" id="sf-save">${x ? 'Save changes' : 'Save charge'}</button></div>
    <datalist id="dl-what">${whats.map((w) => `<option value="${esc(w)}">`).join('')}</datalist>
    <datalist id="dl-card">${cards.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
  </section>`;
}
function renderSpend() {
  const el = $('#view');
  const head = `<div class="sum-head"><div><h1>Spend</h1></div>${spendForm.open ? '' : '<button class="btn primary" id="new-charge">Add a charge</button>'}</div><div style="height:16px"></div>`;
  if (!state.spend.length && !spendForm.open) {
    el.innerHTML = `${head}${emptyState('No spend log yet', 'Add your first charge by typing it in, or import your spend log CSV.', 'charge')}`;
    bindPick(el); bindSpend(); return;
  }
  const total = state.spend.reduce((s, x) => s + (x.amount || 0), 0);
  const adSpend = state.ads.reduce((s, a) => s + (a.spend || 0), 0);
  const bars = (m) => { const arr = [...m].map(([k, l]) => [k, l.reduce((s, x) => s + (x.amount || 0), 0), l.length]).sort((a, b) => b[1] - a[1]); const max = Math.max(...arr.map((x) => x[1]), 0.01);
    return `<div class="bars">${arr.map(([k, v, n]) => `<div class="b"><div>${esc(k)} <span class="small">×${n}</span></div><div class="t"><i style="width:${(100 * v / max).toFixed(1)}%"></i></div><div class="v">${usd(v)}</div></div>`).join('')}</div>`; };
  const byWhat = groupBy(state.spend, (x) => (x.what || 'Other').trim().replace(/\s+/g, ' '));
  const byCard = groupBy(state.spend, (x) => x.card || 'Not logged');
  const list = [...state.spend].sort((a, b) => dateKey(b.date) - dateKey(a.date));
  el.innerHTML = `${head}
    ${spendForm.open ? spendFormHTML() : ''}
    ${state.spend.length ? `
    <p class="lede">${usd(total)} out across ${plural(state.spend.length, 'charge')}${state.ads.length ? `. ${usd(adSpend)} of it shows up as ad spend on your ads (${pct(total ? adSpend / total : null)}).` : '.'}</p>
    <div class="grid2">
      <section class="panel"><h2>By what it was for</h2><p class="note">From the What column.</p>${bars(byWhat)}</section>
      <section class="panel"><h2>By card</h2><p class="note">From the Card column.</p>${bars(byCard)}</section>
    </div>
    <section style="margin-top:16px"><h2>Every charge</h2><p class="note">Most recent first.</p>
      <div class="tbl-wrap"><table id="spend-tbl"><thead><tr><th>Date</th><th>What</th><th>Card</th><th class="r">Amount</th><th class="hide-sm">Notes</th><th></th></tr></thead>
      <tbody>${list.map((x) => `<tr><td>${esc(x.date)}</td><td>${esc(x.what)}</td><td>${esc(x.card)}</td><td class="r">${usd(x.amount)}</td><td class="hide-sm">${esc(x.notes)}</td>
        <td class="r" style="white-space:nowrap"><button class="link" data-sedit="${x.id}">Edit</button><button class="link danger-link" data-sdel="${x.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>
    </section>` : ''}`;
  bindSpend();
}
function bindSpend() {
  const el = $('#view');
  const nb = $('#new-charge'); if (nb) nb.addEventListener('click', () => { spendForm.open = true; spendForm.id = null; renderSpend(); const w = $('#sf-what'); if (w) w.focus(); });
  const c = $('#sf-cancel'); if (c) c.addEventListener('click', () => { spendForm.open = false; spendForm.id = null; renderSpend(); });
  const s = $('#sf-save');
  if (s) {
    const saveCharge = () => {
      const existing = spendForm.id ? state.spend.find((x) => x.id === spendForm.id) : null;
      const rec = { ...(existing || {}), id: existing ? existing.id : 's' + hash(Date.now() + '' + Math.random()), date: mdFromISO($('#sf-date').value), what: $('#sf-what').value.trim(), card: $('#sf-card').value.trim(), amount: money($('#sf-amount').value), notes: $('#sf-notes').value.trim(), source: existing ? existing.source : 'Typed in' };
      if (rec.amount == null) { toast('Add the amount.'); $('#sf-amount').focus(); return; }
      if (existing) state.spend = state.spend.map((x) => (x.id === existing.id ? rec : x)); else state.spend.push(rec);
      spendForm.open = false; spendForm.id = null; save(); toast(existing ? 'Charge updated.' : 'Charge saved.'); render();
    };
    s.addEventListener('click', saveCharge);
    $('#spend-form').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey)) { e.preventDefault(); saveCharge(); } });
  }
  el.querySelectorAll('[data-sedit]').forEach((b) => b.addEventListener('click', () => { spendForm.open = true; spendForm.id = b.dataset.sedit; renderSpend(); window.scrollTo(0, 0); }));
  el.querySelectorAll('[data-sdel]').forEach((b) => b.addEventListener('click', () => {
    if (!confirm('Delete this charge?')) return;
    state.spend = state.spend.filter((x) => x.id !== b.dataset.sdel); save(); render(); toast('Charge deleted.');
  }));
}

      <div class="toolbar">

    </section>

/* ============ Files ============ */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const picker = $('#file');
picker.addEventListener('change', () => { if (picker.files.length) importFiles([...picker.files]); picker.value = ''; });
function bindPick(root) {
  root.querySelectorAll('[data-pick]').forEach((d) => {
    d.addEventListener('click', () => picker.click());
    d.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); } });
    d.addEventListener('dragover', (e) => { e.preventDefault(); d.classList.add('over'); });
    d.addEventListener('dragleave', () => d.classList.remove('over'));
  });
}
let dragDepth = 0;
const veil = $('#veil');
window.addEventListener('dragenter', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; veil.classList.add('on'); } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) veil.classList.remove('on'); });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; veil.classList.remove('on');
  const files = [...(e.dataTransfer?.files || [])]; if (files.length) importFiles(files);
});

if ((state.creatives || []).length) { syncCreativeAds(); save(); }
